services:
  - type: web
    name: pull-panda-ai-bridge
    env: python
    rootDir: Versions/Updated_version
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn api_server:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GROQ_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false

  - type: web
    name: pull-panda-dashboard
    env: node
    rootDir: Dashboard
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: APP_URL
        fromService:
          type: web
          name: pull-panda-dashboard
          property: host
      - key: FRONTEND_URL
        fromService:
          type: web
          name: pull-panda-dashboard
          property: host
      - key: GITHUB_REDIRECT_URI
        fromService:
          type: web
          name: pull-panda-dashboard
          property: host
      - key: PYTHON_API_URL
        fromService:
          type: web
          name: pull-panda-ai-bridge
          property: host
