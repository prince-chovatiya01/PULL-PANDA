<svg width="860" height="230" viewBox="0 0 860 230" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pandaGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#238636" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#1f6feb" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#8957e5" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="860" height="230" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>

  <!-- Top Header & Live Metrics -->
  <text x="35" y="32" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="9" fill="#58a6ff" letter-spacing="1.2">SYSTEM ARCHITECTURE // PROD ENGINE</text>
  <text x="35" y="56" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','Noto Sans',sans-serif" font-size="16" font-weight="700" fill="#f0f6fc">Pull Panda · Autonomous AI Code Reviewer</text>

  <!-- Metric Badges Top-Right (Cleanly Isolated Groups) -->
  <g transform="translate(560, 18)">
    <g transform="translate(0, 0)">
      <rect width="125" height="42" rx="4" fill="#161b22" stroke="#238636" stroke-width="1"/>
      <text x="12" y="17" font-family="'SFMono-Regular',Consolas,monospace" font-size="7.5" fill="#3fb950">REVIEW CYCLE</text>
      <text x="12" y="33" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">60% Reduction</text>
    </g>

    <g transform="translate(135, 0)">
      <rect width="130" height="42" rx="4" fill="#161b22" stroke="#388bfd" stroke-width="1"/>
      <text x="12" y="17" font-family="'SFMono-Regular',Consolas,monospace" font-size="7.5" fill="#58a6ff">ACTIVE DEPLOY</text>
      <text x="12" y="33" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="13" font-weight="700" fill="#f0f6fc">10+ Repositories</text>
    </g>
  </g>

  <!-- Architecture Flow Pipeline -->
  <g transform="translate(35, 78)">
    <!-- Stage 1: GitHub Webhook -->
    <rect x="0" y="20" width="105" height="70" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="20" cy="38" r="4" fill="#58a6ff"/>
    <text x="32" y="41" font-family="'SFMono-Regular',Consolas,monospace" font-size="8.5" font-weight="600" fill="#f0f6fc">GITHUB PR</text>
    <text x="12" y="62" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8b949e">Webhook Event</text>
    <text x="12" y="76" font-family="'SFMono-Regular',Consolas,monospace" font-size="7.5" fill="#6e7681">payload digest</text>

    <!-- Arrow 1 -->
    <path d="M 105 55 L 125 55" stroke="#58a6ff" stroke-width="1.5"/>
    <polygon points="125,52 131,55 125,58" fill="#58a6ff"/>

    <!-- Stage 2: Diff & AST Engine -->
    <rect x="135" y="20" width="115" height="70" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="152" cy="38" r="4" fill="#3fb950"/>
    <text x="163" y="41" font-family="'SFMono-Regular',Consolas,monospace" font-size="8.5" font-weight="600" fill="#f0f6fc">DIFF ENGINE</text>
    <text x="147" y="62" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8b949e">Chunking &amp; AST</text>
    <text x="147" y="76" font-family="'SFMono-Regular',Consolas,monospace" font-size="7.5" fill="#6e7681">semantic patch</text>

    <!-- Arrow 2 -->
    <path d="M 250 55 L 270 55" stroke="#3fb950" stroke-width="1.5"/>
    <polygon points="270,52 276,55 270,58" fill="#3fb950"/>

    <!-- Stage 3: Multi-Model Inference (Centerpiece) -->
    <rect x="280" y="0" width="225" height="110" rx="6" fill="#161b22" stroke="#58a6ff" stroke-width="1.5"/>
    <rect x="280" y="0" width="225" height="110" rx="6" fill="url(#pandaGrad)"/>
    <text x="295" y="24" font-family="'SFMono-Regular',Consolas,monospace" font-size="9" font-weight="700" fill="#79c0ff">LLM REASONING CORE</text>
    
    <!-- Model Routers -->
    <rect x="295" y="36" width="195" height="20" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="0.8"/>
    <text x="305" y="50" font-family="'SFMono-Regular',Consolas,monospace" font-size="7.5" fill="#58a6ff">Cloud Router: Claude / GPT-4o</text>

    <rect x="295" y="60" width="195" height="20" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="0.8"/>
    <text x="305" y="74" font-family="'SFMono-Regular',Consolas,monospace" font-size="7.5" fill="#3fb950">Local LLM: Ollama / DeepSeek</text>

    <rect x="295" y="84" width="195" height="20" rx="3" fill="#0d1117" stroke="#30363d" stroke-width="0.8"/>
    <text x="305" y="98" font-family="'SFMono-Regular',Consolas,monospace" font-size="7.5" fill="#d29922">Security &amp; Complexity Check</text>

    <!-- Arrow 3 -->
    <path d="M 505 55 L 525 55" stroke="#bc8cff" stroke-width="1.5"/>
    <polygon points="525,52 531,55 525,58" fill="#bc8cff"/>

    <!-- Stage 4: Review Synthesizer -->
    <rect x="535" y="20" width="115" height="70" rx="6" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="552" cy="38" r="4" fill="#a371f7"/>
    <text x="563" y="41" font-family="'SFMono-Regular',Consolas,monospace" font-size="8.5" font-weight="600" fill="#f0f6fc">SYNTHESIS</text>
    <text x="547" y="62" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8b949e">Security &amp; Perf</text>
    <text x="547" y="76" font-family="'SFMono-Regular',Consolas,monospace" font-size="7.5" fill="#6e7681">json-structured</text>

    <!-- Arrow 4 -->
    <path d="M 650 55 L 670 55" stroke="#a371f7" stroke-width="1.5"/>
    <polygon points="670,52 676,55 670,58" fill="#a371f7"/>

    <!-- Stage 5: GitHub Inline Comments -->
    <rect x="680" y="20" width="110" height="70" rx="6" fill="#161b22" stroke="#238636" stroke-width="1"/>
    <circle cx="698" cy="38" r="4" fill="#3fb950"/>
    <text x="708" y="41" font-family="'SFMono-Regular',Consolas,monospace" font-size="8.5" font-weight="600" fill="#f0f6fc">INLINE PR</text>
    <text x="692" y="62" font-family="-apple-system,BlinkMacSystemFont,sans-serif" font-size="9" fill="#8b949e">Actionable Diffs</text>
    <text x="692" y="76" font-family="'SFMono-Regular',Consolas,monospace" font-size="7.5" fill="#3fb950">auto-annotated</text>
  </g>

  <!-- Bottom Architecture Specs -->
  <text x="35" y="210" font-family="'SFMono-Regular',Consolas,'Liberation Mono',monospace" font-size="8" fill="#6e7681">STACK : FastAPI · Node.js · GitHub Apps API · LangChain · Docker · Vector Retrieval</text>
</svg>
